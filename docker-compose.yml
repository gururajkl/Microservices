services:
  mysql-container:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - ./MySqlQuery:/docker-entrypoint-initdb.d
    networks:
      - ecommerce-network
    hostname: mysql-host-product-microservice
    command: --lower_case_table_names=1
  
  product-microservice:
    image: gururaj7741/ecommerce-product-microservice:v1.0
    environment:
      MYSQL_HOSTNAME: mysql-host-product-microservice
      MYSQL_PASSWORD: admin
    ports:
      - "8080:8080"
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
