services:
  ecommerce.api:
    image: ecommerceapi
    build:
      context: .
      dockerfile: Ecommerce.API/Dockerfile
    ports:
      - "7000:8080"
    environment:
      - MONGO_HOST=mongodb-container
      - MONGO_PORT=27017
      - MONGODB_DATABASE=OrdersDatabase
      - UsersMicroserviceName=usersmicroservice
      - UsersMicroservicePort=9090
    networks:
      - order-mongo-db-network

  mongodb-container:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - ../DatabaseQuery/orders-init:/docker-entrypoint-initdb.d
    networks:
      - order-mongo-db-network

networks:
  order-mongo-db-network:
    driver: bridge