services:
  mysql-container:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - ./DatabaseQuery/products-init:/docker-entrypoint-initdb.d
    networks:
      - ecommerce-network
    hostname: mysql-host-products-microservice
    command: --lower_case_table_names=1
  
  products-microservice:
    image: gururaj7741/ecommerce-products-microservice:v1.0
    environment:
      MYSQL_HOSTNAME: mysql-host-products-microservice
      MYSQL_PASSWORD: admin
    ports:
      - "8080:8080"
    networks:
      - ecommerce-network

  postgres-container:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: eCommerceUsers
    ports:
      - "5432:5432"
    volumes:
      - ./DatabaseQuery/users-init:/docker-entrypoint-initdb.d
    networks:
      - ecommerce-network

  users-microservice:
    image: gururaj7741/ecommerce-users-microservice:v1.0
    environment:
      POSTGRES_HOSTNAME: postgres-container
      POSTGRES_PASSWORD: admin
    ports:
      - "9090:9090"
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
